# =============================================================================
# Stratford City Motorcars — Render blueprint (website + admin)
#
# The API and its Postgres are already deployed and are NOT described here, so
# that applying this blueprint can never create a second API or a second,
# empty database:
#
#     API   https://stratford-city-motorcars-ltd.onrender.com
#
# Both services below are built from the repo root (no rootDir) so pnpm can
# resolve the workspace, and `turbo --filter` narrows each build to one app
# plus the packages it depends on. Without the filter, Render builds all three
# apps in every service and the admin fails on its missing environment.
#
# NEXT_PUBLIC_* values are compiled into the JavaScript at build time, not read
# at runtime, so changing one needs a redeploy, not just a restart.
#
# Values marked `sync: false` must be filled in on the dashboard: they are
# secrets, or they must be copied from the existing API service so that both
# sides agree. See "After applying" in the notes that came with this file.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Website — the public showroom. Reads stock from the database directly and
  # only calls the API for photographs it cannot find on local disk.
  # ---------------------------------------------------------------------------
  - type: web
    name: scm-web
    runtime: node
    region: frankfurt
    plan: starter
    branch: master
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm exec turbo run build --filter=web
    startCommand: pnpm --filter web start
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production

      # MUST be the same database the API writes to, or the website will show
      # different stock from the admin. Copy the value from the API service's
      # DATABASE_URL (Internal Database URL). The website reads stock at build
      # time as well as at runtime, so this is needed for the build to be right.
      - key: DATABASE_URL
        sync: false

      # The live API.
      - key: NEXT_PUBLIC_SERVER_URL
        value: https://stratford-city-motorcars-ltd.onrender.com
      # Where /media/... requests go when the file is not on local disk: the
      # API serves photographs out of the R2 bucket.
      - key: MEDIA_PROXY_ORIGIN
        value: https://stratford-city-motorcars-ltd.onrender.com
      # Read photographs straight from R2 instead, so a sleeping API never
      # holds up a car's photographs (the proxy above becomes the fallback).
      # Create a READ-ONLY R2 API token for the bucket; the bucket name and
      # endpoint are the API's UPLOAD_BUCKET and its R2 account endpoint.
      - key: MEDIA_BUCKET
        sync: false
      - key: MEDIA_BUCKET_ENDPOINT
        sync: false
      - key: MEDIA_BUCKET_ACCESS_KEY_ID
        sync: false
      - key: MEDIA_BUCKET_SECRET_ACCESS_KEY
        sync: false

      # The canonical origin: drives canonical tags, Open Graph, sitemap.xml
      # and robots.txt. Until DNS points at Render, set this on the dashboard
      # to the service's own onrender.com URL instead, or search engines are
      # told to index a host that does not resolve yet.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.stratfordcitymotorcars.com

      # Must match the API's REVALIDATE_SECRET exactly: the API signs cache
      # refresh calls with it and the website checks them. Copy the value from
      # the API service. If they differ, /api/revalidate rejects every call and
      # published changes take up to 5 minutes to appear instead of being
      # immediate.
      - key: REVALIDATE_SECRET
        sync: false

      # Enquiry notifications. Optional: without them the enquiry still saves
      # to the database and shows in the admin, it just is not emailed.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ENQUIRY_EMAIL_TO
        sync: false
      - key: LEADS_WEBHOOK_URL
        sync: false
      - key: LEADS_WEBHOOK_TOKEN
        sync: false

  # ---------------------------------------------------------------------------
  # Admin — the staff screens. A browser-only app: it holds no secrets and
  # talks to the API, which owns the session cookie.
  # ---------------------------------------------------------------------------
  - type: web
    name: scm-admin
    runtime: node
    region: frankfurt
    plan: starter
    branch: master
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm exec turbo run build --filter=admin
    # `next start` is pinned to port 3002 in package.json for local use, which
    # would ignore the port Render assigns — so the port is passed explicitly.
    startCommand: pnpm --filter admin exec next start --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production

      # Never `mock`: the build refuses it in production so that invented cars
      # and customers can never be served to the dealership.
      - key: NEXT_PUBLIC_ADMIN_DATA
        value: api
      # The live API. Staff sign-in cookies are set by this origin, so it must
      # also appear in the API's CORS_ORIGIN.
      - key: NEXT_PUBLIC_ADMIN_API_URL
        value: https://stratford-city-motorcars-ltd.onrender.com

      # Used for "view on website" links and for photographs recorded as
      # site-relative paths. Keep this in step with the website's own
      # NEXT_PUBLIC_SITE_URL.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.stratfordcitymotorcars.com
